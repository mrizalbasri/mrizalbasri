name: Update profile metrics

on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-metrics.mjs
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check metrics access
        id: access
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::Set METRICS_TOKEN with read access to your public and private repositories. Keeping the existing cards until it is configured.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Generate metrics
        if: steps.access.outputs.available == 'true'
        run: node scripts/generate-metrics.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Save updated cards
        if: steps.access.outputs.available == 'true'
        run: |
          git add assets/github-metrics-light.svg assets/github-metrics-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh GitHub metrics'
          git push origin HEAD:main
