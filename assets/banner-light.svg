<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="title desc">
  <title id="title">M. Rizal Basri — Full-Stack Developer, AI Engineer, Security Enthusiast</title>
  <desc id="desc">Animated light violet ASCII-background profile banner for M. Rizal Basri.</desc>

  <defs>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="899" height="239" rx="14"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f7fc"/>
      <stop offset="50%" stop-color="#f3f0fa"/>
      <stop offset="100%" stop-color="#f7f6fb"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d8dce8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="auraCenter" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f8f7fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraLeft" cx="12%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f8f7fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraRight" cx="88%" cy="78%" r="36%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f8f7fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#f8f7fc" stop-opacity="0.95"/>
      <stop offset="58%" stop-color="#f8f7fc" stop-opacity="0.76"/>
      <stop offset="85%" stop-color="#f8f7fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f8f7fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="slashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ascii {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .muted { fill: #64748b; opacity: 0.34; }
    .dim { fill: #94a3b8; opacity: 0.34; }
    .violet { fill: #7c3aed; opacity: 0.32; }
    .lav { fill: #6d28d9; opacity: 0.25; }

    @keyframes driftL {
      from { transform: translateX(0px); }
      to { transform: translateX(-900px); }
    }
    @keyframes driftR {
      from { transform: translateX(-900px); }
      to { transform: translateX(0px); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes slashPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.68; }
    }
    @keyframes sweep {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(1120px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    .d-l-slow { animation: driftL 46s linear infinite; }
    .d-r-slow { animation: driftR 52s linear infinite; }
    .d-l-med  { animation: driftL 34s linear infinite; }
    .d-r-med  { animation: driftR 38s linear infinite; }
    .d-l-fast { animation: driftL 28s linear infinite; }

    .aura-breathe { animation: breathe 6s ease-in-out infinite; }
    .slash-anim   { animation: slashPulse 5s ease-in-out infinite; }
    .sweep-bar    { animation: sweep 8.5s ease-in-out infinite; }
    .cursor       { animation: blink 1.15s steps(1) infinite; }
    .dot          { animation: dotPulse 2.4s ease-in-out infinite; }

    .kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2.6px;
      fill: #6d28d9;
    }
    .name {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: url(#titleGrad);
    }
    .role {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14.5px;
      fill: #1e293b;
    }
    .stack {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      fill: #5b6380;
      letter-spacing: 0.4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .d-l-slow, .d-r-slow, .d-l-med, .d-r-med, .d-l-fast,
      .aura-breathe, .slash-anim, .sweep-bar, .cursor, .dot {
        animation: none;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#auraLeft)" class="aura-breathe"/>
    <rect width="900" height="240" fill="url(#auraRight)" class="aura-breathe"/>

    <g class="ascii" xml:space="preserve">
      <g class="d-l-slow muted">
        <text x="0" y="21" textLength="892" lengthAdjust="spacing">. : // ~~ .. -- ++ :: /\ \/ .. ~~ : // -- == .. +* :: .. // ~~ -- :: /\ \/ .. ++ == :: .. // ~~</text>
        <text x="900" y="21" textLength="892" lengthAdjust="spacing">. : // ~~ .. -- ++ :: /\ \/ .. ~~ : // -- == .. +* :: .. // ~~ -- :: /\ \/ .. ++ == :: .. // ~~</text>
      </g>
      <g class="d-r-med violet">
        <text x="0" y="42" textLength="892" lengthAdjust="spacing">::  0xA8  //  ~~  [SYS]  ..  ::  /\  --  [AI]  ::  ~~  0x5F  //  ..  [SEC]  ::  ~~  ++  ::  //</text>
        <text x="900" y="42" textLength="892" lengthAdjust="spacing">::  0xA8  //  ~~  [SYS]  ..  ::  /\  --  [AI]  ::  ~~  0x5F  //  ..  [SEC]  ::  ~~  ++  ::  //</text>
      </g>
      <g class="d-l-med dim">
        <text x="0" y="63" textLength="892" lengthAdjust="spacing">-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*</text>
        <text x="900" y="63" textLength="892" lengthAdjust="spacing">-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*~*:._.-~-._.-~-._.:*</text>
      </g>
      <g class="d-r-slow muted">
        <text x="0" y="84" textLength="892" lengthAdjust="spacing">01 .. :: \\ // == -- ++ .. 10 :: ~~ // \\ == -- ++ .. 01 :: ~~ \\ // == -- ++ .. 10 :: ~~ // \\</text>
        <text x="900" y="84" textLength="892" lengthAdjust="spacing">01 .. :: \\ // == -- ++ .. 10 :: ~~ // \\ == -- ++ .. 01 :: ~~ \\ // == -- ++ .. 10 :: ~~ // \\</text>
      </g>
      <g class="d-l-fast lav">
        <text x="0" y="105" textLength="892" lengthAdjust="spacing">///  ..  ::  &lt;/&gt;  ~~  --  ::  **  ..  ///  ::  &lt;/&gt;  ~~  --  ::  **  ..  ///  ::  &lt;/&gt;  ~~  --</text>
        <text x="900" y="105" textLength="892" lengthAdjust="spacing">///  ..  ::  &lt;/&gt;  ~~  --  ::  **  ..  ///  ::  &lt;/&gt;  ~~  --  ::  **  ..  ///  ::  &lt;/&gt;  ~~  --</text>
      </g>
      <g class="d-r-med dim">
        <text x="0" y="126" textLength="892" lengthAdjust="spacing">+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::.</text>
        <text x="900" y="126" textLength="892" lengthAdjust="spacing">+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::..+-+--+-+--+-+..::.</text>
      </g>
      <g class="d-l-slow muted">
        <text x="0" y="147" textLength="892" lengthAdjust="spacing">:: /\ \/ == -- .. ++ :: // ~~ /\ \/ == -- .. ++ :: // ~~ /\ \/ == -- .. ++ :: // ~~ /\ \/ == --</text>
        <text x="900" y="147" textLength="892" lengthAdjust="spacing">:: /\ \/ == -- .. ++ :: // ~~ /\ \/ == -- .. ++ :: // ~~ /\ \/ == -- .. ++ :: // ~~ /\ \/ == --</text>
      </g>
      <g class="d-r-slow violet">
        <text x="0" y="168" textLength="892" lengthAdjust="spacing">~~  ::  //  \\  [NET]  ..  ++  --  ::  0x7C  ~~  //  \\  [DEV]  ..  ++  --  ::  0xE9  ~~  //</text>
        <text x="900" y="168" textLength="892" lengthAdjust="spacing">~~  ::  //  \\  [NET]  ..  ++  --  ::  0x7C  ~~  //  \\  [DEV]  ..  ++  --  ::  0xE9  ~~  //</text>
      </g>
      <g class="d-l-med dim">
        <text x="0" y="189" textLength="892" lengthAdjust="spacing">.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-</text>
        <text x="900" y="189" textLength="892" lengthAdjust="spacing">.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-~-._.:*~*:._.-</text>
      </g>
      <g class="d-r-med muted">
        <text x="0" y="210" textLength="892" lengthAdjust="spacing">-- ++ :: // == .. ~~ ** 01 -- ++ :: // == .. ~~ ** 10 -- ++ :: // == .. ~~ ** 01 -- ++ :: // ==</text>
        <text x="900" y="210" textLength="892" lengthAdjust="spacing">-- ++ :: // == .. ~~ ** 01 -- ++ :: // == .. ~~ ** 10 -- ++ :: // == .. ~~ ** 01 -- ++ :: // ==</text>
      </g>
      <g class="d-l-fast lav">
        <text x="0" y="231" textLength="892" lengthAdjust="spacing">.. :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\</text>
        <text x="900" y="231" textLength="892" lengthAdjust="spacing">.. :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\ \/ .. == ++ -- :: // ~~ /\</text>
      </g>
    </g>

    <g class="slash-anim" stroke="url(#slashGrad)" stroke-linecap="round">
      <line x1="28" y1="14" x2="156" y2="112" stroke-width="1.6"/>
      <line x1="48" y1="6" x2="132" y2="70" stroke-width="0.9" opacity="0.6"/>
      <line x1="744" y1="128" x2="872" y2="226" stroke-width="1.6"/>
      <line x1="768" y1="170" x2="852" y2="234" stroke-width="0.9" opacity="0.6"/>
    </g>

    <rect class="sweep-bar" x="0" y="0" width="200" height="240" fill="url(#sweepGrad)"/>

    <ellipse cx="450" cy="120" rx="355" ry="104" fill="url(#vignette)"/>
    <ellipse cx="450" cy="116" rx="260" ry="78" fill="url(#auraCenter)" class="aura-breathe"/>

    <g stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.4" fill="none">
      <path d="M18 32 V18 H32"/>
      <path d="M882 32 V18 H868"/>
      <path d="M18 208 V222 H32"/>
      <path d="M882 208 V222 H868"/>
    </g>

    <g text-anchor="middle">
      <g transform="translate(450, 56)">
        <circle cx="-102" cy="-4" r="3" fill="#7c3aed" class="dot"/>
        <text x="5" y="0" class="kicker">PROFILE // MRIZALBASRI</text>
      </g>

      <text x="450" y="114" class="name">M. RIZAL BASRI</text>

      <rect x="260" y="132" width="380" height="1.5" rx="0.75" fill="url(#dividerGrad)"/>

      <text x="450" y="164" class="role">
        Full-Stack Developer  ·  AI Engineer  ·  Security Enthusiast<tspan class="cursor" fill="#7c3aed"> _</tspan>
      </text>

      <text x="450" y="194" class="stack">SvelteKit  ·  FastAPI  ·  Go  ·  PostgreSQL  ·  LangGraph</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="url(#borderGrad)"/>
</svg>
